validation:
  split: validation
  output_root: artifacts/backtests
  include_baselines: true
  include_ppo: true
  metric_for_selection: sharpe_ratio

final_test:
  split: test
  require_confirm_final_test: true
  output_root: artifacts/final_model

robustness:
  transaction_cost_bps: [0.0, 5.0, 10.0, 25.0, 50.0]
  regime_windows:
    - name: validation_2024
      start_date: "2024-01-01"
      end_date: "2024-12-31"
    - name: rate_hike_2022
      start_date: "2022-01-01"
      end_date: "2022-12-31"
    - name: covid_2020
      start_date: "2020-02-01"
      end_date: "2020-12-31"

selection:
  primary_metric: sharpe_ratio
  higher_is_better: true
  tie_breakers:
    - max_drawdown
    - average_weekly_turnover
    - transaction_cost_drag
  min_eligible_seeds: 3
  require_beats_shy_total_return: true
  equal_weight_sharpe_tolerance: 0.10
  equal_weight_drawdown_tolerance: 0.02
  max_median_weekly_turnover: 0.50
  max_median_transaction_cost_drag: 0.025

policy_behavior:
  dominance_weight_threshold: 0.80
  dominance_date_fraction: 0.80
  active_weight_threshold: 0.05
  concentration_hhi_threshold: 0.25
  turnover_spike_quantile: 0.95
  high_volatility_quantile: 0.75
  static_target_change_threshold: 0.01
  lucky_month_positive_return_share: 0.50
  sensitivity_low_quantile: 0.25
  sensitivity_high_quantile: 0.75
  sensitivity_material_weight_shift: 0.01

statistical_validation:
  bootstrap_iterations: 10000
  block_length_trading_days: 10
  confidence_level: 0.95
  random_seed: 42
